# Configuração autoritativa do site. O mesmo conjunto de regras de rewrite
# está em public/.htaccess, para o caso de rodar num Apache tradicional fora
# do Docker — aqui elas vêm embutidas para não depender de AllowOverride.

<VirtualHost *:80>
    # Só a pasta public/ é servida. app/, database/, storage/, .env e vendor/
    # ficam fora do alcance do navegador.
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
        Options -Indexes +FollowSymLinks

        <IfModule mod_rewrite.c>
            RewriteEngine On

            # Arquivo ou diretório que existe de verdade (css/, js/) é servido
            # direto pelo Apache, sem passar pelo PHP.
            RewriteCond %{REQUEST_FILENAME} -f [OR]
            RewriteCond %{REQUEST_FILENAME} -d
            RewriteRule ^ - [L]

            # Todo o resto vai para o front controller.
            RewriteRule ^ index.php [L]
        </IfModule>
    </Directory>

    # Log no stdout/stderr do container: `docker compose logs -f app`.
    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
