; Configuração de desenvolvimento — priorize erro visível a performance.
memory_limit = 512M
max_execution_time = 120
date.timezone = UTC

display_errors = On
display_startup_errors = On
error_reporting = E_ALL
log_errors = On

upload_max_filesize = 32M
post_max_size = 32M

; opcache ligado, mas revalidando arquivos: editar no host tem efeito imediato.
opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
